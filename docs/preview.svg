<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" role="img" aria-labelledby="title desc">
  <title id="title">Nested turn folders and the conversation tree navigator</title>
  <desc id="desc">Left: a chat transcript where turn 1 contains turns 2 and 3, and turn 2 contains turn 4, with folder rows under each parent. Right: the conversation tree panel listing the same turns indented by depth.</desc>
  <defs>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
      .title{fill:#1f2430;font-size:14px;font-weight:600}
      .ink{fill:#1f2430}
      .secondary{fill:#5b6472}
      .tertiary{fill:#9aa3b2}
      .faint{fill:#b3bac6}
      .eyebrow{fill:#9aa3b2;font-size:9.5px;font-weight:600;letter-spacing:.08em}
      .rowtitle{fill:#1f2430;font-size:12px}
      .rowpreview{fill:#9aa3b2;font-size:10.5px}
      .bar{fill:#eef0f4}
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="919" height="599" rx="14" fill="#ffffff" stroke="#e6e9ee"/>
  <path d="M14 44.5H906" stroke="#eceef2"/>

  <!-- window header: session label and the Tree entry point -->
  <text x="24" y="28" class="ink" font-size="13" font-weight="600">Session</text>
  <text x="82" y="28" class="tertiary" font-size="11">· 4 turns</text>

  <rect x="780" y="10" width="116" height="24" rx="6" fill="#eef1f6"/>
  <svg x="790" y="15" width="14" height="14" viewBox="0 0 16 16" fill="none">
    <path d="M3.2 3.2h3v3h-3zM9.8 9.8h3v3h-3z" stroke="#5b6472" stroke-width="1.2"/>
    <path d="M4.7 6.2v3.1a1.5 1.5 0 0 0 1.5 1.5h2.1M6.2 9.3V11" stroke="#5b6472" stroke-width="1.2" stroke-linecap="round"/>
  </svg>
  <text x="812" y="26" class="secondary" font-size="12">Tree</text>
  <rect x="846" y="15" width="16" height="14" rx="7" fill="#e1e6ee"/>
  <text x="854" y="25.5" class="secondary" font-size="10" text-anchor="middle">4</text>

  <!-- transcript: turn 1 -->
  <text x="40" y="80" class="eyebrow">TURN 1</text>
  <text x="40" y="102" class="title">How does a turn get into the transcript?</text>
  <rect x="40" y="114" width="524" height="7" rx="3.5" class="bar"/>
  <rect x="40" y="128" width="470" height="7" rx="3.5" class="bar"/>
  <rect x="40" y="142" width="350" height="7" rx="3.5" class="bar"/>

  <svg x="40" y="160" width="14" height="14" viewBox="0 0 16 16" fill="none">
    <path d="M6 3.5 10.5 8 6 12.5" stroke="#9aa3b2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(90 8 8)"/>
  </svg>
  <svg x="60" y="161" width="14" height="14" viewBox="0 0 16 16" fill="none">
    <path d="M2.2 4.2h4l1.2 1.4h6.4v6.2a1.2 1.2 0 0 1-1.2 1.2H3.4a1.2 1.2 0 0 1-1.2-1.2V4.2Z" stroke="#9aa3b2" stroke-width="1.2" stroke-linejoin="round"/>
  </svg>
  <text x="80" y="174" class="secondary" font-size="12">Sub-conversation · 2</text>
  <svg x="212" y="162" width="12" height="12" viewBox="0 0 16 16" fill="none">
    <path d="M8 3.5v9M3.5 8h9" stroke="#9aa3b2" stroke-width="1.5" stroke-linecap="round"/>
  </svg>

  <!-- transcript: turn 2, nested one level -->
  <text x="68" y="214" class="eyebrow">TURN 2</text>
  <text x="68" y="236" class="title">What does turn/end contain?</text>
  <rect x="68" y="248" width="472" height="7" rx="3.5" class="bar"/>
  <rect x="68" y="262" width="396" height="7" rx="3.5" class="bar"/>

  <svg x="68" y="294" width="14" height="14" viewBox="0 0 16 16" fill="none">
    <path d="M6 3.5 10.5 8 6 12.5" stroke="#9aa3b2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(90 8 8)"/>
  </svg>
  <svg x="88" y="295" width="14" height="14" viewBox="0 0 16 16" fill="none">
    <path d="M2.2 4.2h4l1.2 1.4h6.4v6.2a1.2 1.2 0 0 1-1.2 1.2H3.4a1.2 1.2 0 0 1-1.2-1.2V4.2Z" stroke="#9aa3b2" stroke-width="1.2" stroke-linejoin="round"/>
  </svg>
  <text x="108" y="308" class="secondary" font-size="12">Sub-conversation · 1</text>
  <svg x="240" y="296" width="12" height="12" viewBox="0 0 16 16" fill="none">
    <path d="M8 3.5v9M3.5 8h9" stroke="#9aa3b2" stroke-width="1.5" stroke-linecap="round"/>
  </svg>

  <!-- transcript: turn 4, nested two levels -->
  <text x="96" y="344" class="eyebrow">TURN 4</text>
  <text x="96" y="366" class="title">Show me the envelope fields</text>
  <rect x="96" y="378" width="400" height="7" rx="3.5" class="bar"/>
  <rect x="96" y="392" width="300" height="7" rx="3.5" class="bar"/>
  <svg x="96" y="416" width="12" height="12" viewBox="0 0 16 16" fill="none">
    <path d="M8 3.5v9M3.5 8h9" stroke="#c0c7d2" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
  <text x="114" y="426" class="tertiary" font-size="12">Sub-conversation</text>

  <!-- transcript: turn 3, nested one level, sibling of turn 2 -->
  <text x="68" y="456" class="eyebrow">TURN 3</text>
  <text x="68" y="478" class="title">Can I replay a turn?</text>
  <rect x="68" y="490" width="420" height="7" rx="3.5" class="bar"/>
  <rect x="68" y="504" width="330" height="7" rx="3.5" class="bar"/>
  <svg x="68" y="528" width="12" height="12" viewBox="0 0 16 16" fill="none">
    <path d="M8 3.5v9M3.5 8h9" stroke="#c0c7d2" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
  <text x="86" y="538" class="tertiary" font-size="12">Sub-conversation</text>

  <!-- conversation tree panel, anchored under the header button -->
  <g filter="url(#panelShadow)">
    <rect x="596" y="56" width="304" height="212" rx="12" fill="#ffffff" stroke="#e6e9ee"/>
  </g>
  <svg x="610" y="72" width="14" height="14" viewBox="0 0 16 16" fill="none">
    <path d="M3.2 3.2h3v3h-3zM9.8 9.8h3v3h-3z" stroke="#5b6472" stroke-width="1.2"/>
    <path d="M4.7 6.2v3.1a1.5 1.5 0 0 0 1.5 1.5h2.1M6.2 9.3V11" stroke="#5b6472" stroke-width="1.2" stroke-linecap="round"/>
  </svg>
  <text x="632" y="84" class="ink" font-size="12.5" font-weight="600">Conversation tree</text>
  <text x="846" y="84" class="tertiary" font-size="10.5" text-anchor="end">4 turns</text>
  <svg x="872" y="74" width="12" height="12" viewBox="0 0 16 16" fill="none">
    <path d="m4 4 8 8M12 4l-8 8" stroke="#9aa3b2" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
  <path d="M596.5 94H899.5" stroke="#eceef2"/>

  <!-- tree rows -->
  <svg x="604" y="107" width="12" height="12" viewBox="0 0 16 16" fill="none">
    <path d="M6 3.5 10.5 8 6 12.5" stroke="#9aa3b2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(90 8 8)"/>
  </svg>
  <text x="624" y="120" class="rowtitle">How does a turn get in…</text>
  <text x="624" y="134" class="rowpreview">Rebuilt from the session log</text>

  <svg x="618" y="145" width="12" height="12" viewBox="0 0 16 16" fill="none">
    <path d="M6 3.5 10.5 8 6 12.5" stroke="#9aa3b2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(90 8 8)"/>
  </svg>
  <text x="638" y="158" class="rowtitle">What does turn/end contain?</text>
  <text x="638" y="172" class="rowpreview">The closing event of a turn</text>

  <text x="652" y="196" class="rowtitle">Show me the envelope fields</text>
  <text x="652" y="210" class="rowpreview">seq, time, and the event payload</text>

  <text x="638" y="234" class="rowtitle">Can I replay a turn?</text>
  <text x="638" y="248" class="rowpreview">Replay derives from the log</text>

  <!-- legend and caption -->
  <text x="40" y="566" class="tertiary" font-size="11">▾ collapse a folder</text>
  <text x="150" y="566" class="tertiary" font-size="11">＋ start a sub-conversation</text>
  <text x="310" y="566" class="tertiary" font-size="11">Tree opens the navigator</text>
  <text x="40" y="586" class="faint" font-size="10.5">Illustration — in the app, colors, spacing, and text follow your theme and locale.</text>
</svg>
